serving:
  reverseProxyPrefix: www.yext-cdntest.com/rptest
dynamicRoutes:
  - from: /assets/*
    to: /rptest/assets/:splat
    status: 200
buildConfiguration:
  buildCommand: npm run build
  installDependenciesStep:
    command: npm install
    requiredFiles:
      - package.json
      - package-lock.json
      - .npmrc
livePreviewConfiguration:
  setupCommand: ":"
sitemap:
  excludeList:
    - edit