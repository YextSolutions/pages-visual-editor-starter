serving:
  reverseProxyPrefix: www.ediblearrangements.com/stores
dynamicRoutes:
  - from: /assets/*
    to: /stores/assets/:splat
    status: 200
buildConfiguration:
  buildCommand: npm run build -- ${YEXT_REVERSE_PROXY_PREFIX:+--reverse-proxy-prefix="$YEXT_REVERSE_PROXY_PREFIX"}
  installDependenciesStep:
    command: npm install
    requiredFiles:
      - package.json
      - package-lock.json
      - .npmrc
livePreviewConfiguration:
  setupCommand: ":"
sitemap:
  excludeList:
    - edit